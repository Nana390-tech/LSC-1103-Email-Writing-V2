<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Send It Right</title>
<style>
/* Layout: an email client — folders (CBL phases) on the left, each activity opens like a message. Postage-stamp badges. Theme: moss & berry. */
:root{
  --bg:#f4f7ec; --surface:#ffffff; --surface-2:#edf2e2; --ink:#1d2414; --muted:#5b6750; --line:#d9e2c9;
  --moss:#4a6b14; --moss-soft:#e3ecce; --on-moss:#ffffff;
  --berry:#b3175a; --berry-soft:#fbe4ee; --on-berry:#ffffff;
  --good:#2e7d32; --good-soft:#e2f2df; --bad:#c0392b; --bad-soft:#fbe5e2; --warn:#a86a10;
  --f-display:"Avenir Next","Segoe UI Variable Display","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;
  --f-ar:"Noto Naskh Arabic","Geeza Pro","Arabic Typesetting",Tahoma,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10140b; --surface:#192012; --surface-2:#212a18; --ink:#eef3e3; --muted:#a5b096; --line:#334026;
  --moss:#a9d660; --moss-soft:#2a3916; --on-moss:#10140b;
  --berry:#f37ab3; --berry-soft:#3f1729; --on-berry:#10140b;
  --good:#74d378; --good-soft:#1d3a1e; --bad:#ff8a7a; --bad-soft:#42201b; --warn:#f0b75e;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10140b; --surface:#192012; --surface-2:#212a18; --ink:#eef3e3; --muted:#a5b096; --line:#334026;
  --moss:#a9d660; --moss-soft:#2a3916; --on-moss:#10140b;
  --berry:#f37ab3; --berry-soft:#3f1729; --on-berry:#10140b;
  --good:#74d378; --good-soft:#1d3a1e; --bad:#ff8a7a; --bad-soft:#42201b; --warn:#f0b75e;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.2;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--berry);outline-offset:2px}
.ar{font-family:var(--f-ar);direction:rtl;unicode-bidi:isolate}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.15rem;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.88rem;font-variant-numeric:tabular-nums;cursor:default}
.pill strong{color:var(--moss)}
button.pill{cursor:pointer}
button.pill:hover{border-color:var(--moss)}

.shell{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 40px}
nav.folders{position:sticky;top:76px;align-self:start;display:flex;flex-direction:column;gap:4px}
.folders .lab{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);padding:4px 12px 6px}
.folder{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:9px 12px;cursor:pointer;color:var(--ink)}
.folder:hover{background:var(--surface-2)}
.folder.on{background:var(--moss-soft);font-weight:600}
.folder .ico{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.folder .ico svg{width:15px;height:15px;stroke:var(--moss);fill:none;stroke-width:2}
.folder .t{flex:1;min-width:0}
.folder .t small{display:block;font-weight:400;color:var(--muted);font-size:.76rem;line-height:1.2}
.folder .dot{width:9px;height:9px;border-radius:50%;background:var(--berry);flex:none}
.folder .dot.ok{background:var(--good)}
.folder .dot.none{background:transparent}

main{min-width:0;display:flex;flex-direction:column;gap:22px}

/* message card */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.msg-h{padding:14px 20px;border-bottom:1px solid var(--line);display:grid;gap:2px;background:linear-gradient(var(--surface-2),var(--surface))}
.msg-h .meta{font-size:.8rem;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.msg-h .meta b{color:var(--ink);font-weight:600}
.msg-h h2{font-size:1.25rem}
.msg-b{padding:18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.14em;color:var(--berry);font-weight:700}
.lead{font-size:1.05rem;color:var(--muted);max-width:65ch;margin:0}
p{margin:0;max-width:68ch}

.btn{border:1px solid transparent;border-radius:10px;padding:10px 18px;cursor:pointer;font-weight:600;background:var(--moss);color:var(--on-moss);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}
.btn.alt{background:var(--berry);color:var(--on-berry)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--moss)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{border-radius:10px;padding:10px 14px;font-size:.95rem}
.fb.good{background:var(--good-soft);color:var(--good)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--moss-soft);color:var(--ink)}
.fb b{color:inherit}
.muted{color:var(--muted)}
.small{font-size:.86rem}

/* start */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:26px 22px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--berry)}
.envelope{width:100%;max-width:300px;justify-self:center}
.field{display:flex;flex-direction:column;gap:6px;max-width:420px}
.field label{font-weight:600;font-size:.9rem}
input[type=text],textarea,select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:180px;resize:vertical;line-height:1.6}
.objectives{margin:0;padding-left:1.2em;display:grid;gap:6px}
.objectives li::marker{color:var(--moss);font-weight:700}
.phases{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.phase{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface-2)}
.phase b{display:block;font-family:var(--f-display)}
.phase span{font-size:.85rem;color:var(--muted)}

/* choice buttons */
.choices{display:grid;gap:10px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.choice:hover:not([disabled]){border-color:var(--moss);background:var(--moss-soft)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice[disabled]{cursor:default}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.subjline{font-family:var(--f-mono);font-size:.92rem}
.subjline::before{content:"Subject: ";color:var(--muted)}

/* do/don't */
.sort{display:grid;gap:8px}
.sort-item{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface)}
.sort-item .s{flex:1;min-width:160px}
.sort-item.right{border-color:var(--good);background:var(--good-soft)}
.sort-item.wrong{border-color:var(--bad);background:var(--bad-soft)}
.tag{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600;font-size:.88rem}
.tag.do:hover{border-color:var(--good);color:var(--good)}
.tag.dont:hover{border-color:var(--bad);color:var(--bad)}
.tally{font-variant-numeric:tabular-nums}

/* email mock */
.mail{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.mail-bar{display:flex;gap:6px;padding:8px 12px;background:var(--surface-2);border-bottom:1px solid var(--line);align-items:center}
.mail-bar i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.mail-bar span{margin-left:8px;font-size:.8rem;color:var(--muted)}
.mail-body{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.part{display:block;width:100%;text-align:left;border:1.5px dashed transparent;background:transparent;border-radius:8px;padding:6px 8px;cursor:pointer;color:var(--ink);line-height:1.55}
.part:hover{border-color:var(--moss);background:var(--moss-soft)}
.part.seen{border-color:var(--line)}
.part.active{border-style:solid;border-color:var(--berry);background:var(--berry-soft)}
.part .pl{display:inline-block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--berry);margin-right:6px;vertical-align:1px}
.part.hdr{font-size:.92rem}
.part.hdr .k{color:var(--muted)}
.explain-box{border-left:4px solid var(--berry);background:var(--berry-soft);border-radius:0 10px 10px 0;padding:12px 14px}
.explain-box h3{font-size:1rem;margin-bottom:4px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}

/* order */
.chips{display:flex;flex-direction:column;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;text-align:left;cursor:pointer;color:var(--ink)}
.chip:hover{border-color:var(--moss)}
.chip.right{border-color:var(--good);background:var(--good-soft)}
.chip.wrong{border-color:var(--bad);background:var(--bad-soft)}
.slot-list{border:2px dashed var(--line);border-radius:10px;padding:10px;min-height:120px;display:flex;flex-direction:column;gap:8px}
.slot-list .chip .n{font-variant-numeric:tabular-nums;color:var(--berry);font-weight:700;margin-right:8px}
.colhead{font-size:.8rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin-bottom:6px}

/* compare */
.compare{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.compare .mail-body{font-size:.9rem}
.pickab{display:flex;gap:10px}

/* flip cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.card{perspective:900px;height:210px;cursor:pointer;border:0;background:transparent;padding:0;text-align:left}
.card-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.front{background:var(--surface);justify-content:center;align-items:center;text-align:center}
.front .w{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.front .pos{color:var(--muted);font-size:.85rem}
.front .seen-mark{position:absolute;top:10px;right:12px;font-size:.7rem;color:var(--good);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.back{background:var(--moss-soft);transform:rotateY(180deg);font-size:.9rem;overflow:auto}
.back .ar{font-size:1.2rem;color:var(--berry);font-weight:700}
.back .ex{font-style:italic}
.back .ex b{font-style:normal;color:var(--moss)}
.speak{position:absolute;bottom:10px;right:10px;border:1px solid var(--line);background:var(--surface-2);border-radius:999px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer}
.speak svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:2}
.progress{height:8px;background:var(--surface-2);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.progress i{display:block;height:100%;background:var(--moss);transition:width .3s}

/* phrase bank */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.tab.on{background:var(--moss);color:var(--on-moss);border-color:var(--moss)}
.phr{display:grid;gap:8px}
.phr li{list-style:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface)}
.phr ul{margin:0;padding:0;display:grid;gap:8px}
.phr .use{font-size:.82rem;color:var(--muted)}

/* match */
.match{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:12px}
.mbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;text-align:left;color:var(--ink);width:100%}
.mbtn.sel{border-color:var(--berry);background:var(--berry-soft)}
.mbtn.done{border-color:var(--good);background:var(--good-soft);cursor:default}
.mbtn.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mcol{display:flex;flex-direction:column;gap:8px}

/* gap fill */
.bank{display:flex;flex-wrap:wrap;gap:8px}
.wchip{border:1.5px solid var(--moss);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:600}
.wchip.sel{background:var(--moss);color:var(--on-moss)}
.wchip.used{opacity:.3;cursor:default}
.gaptext{line-height:2.2;background:var(--surface-2);border-radius:10px;padding:16px;border:1px solid var(--line)}
.gap{display:inline-block;min-width:110px;border:0;border-bottom:2px solid var(--berry);background:var(--surface);border-radius:6px 6px 0 0;padding:0 8px;margin:0 2px;cursor:pointer;font-weight:600;color:var(--moss);line-height:1.6}
.gap.right{border-color:var(--good);background:var(--good-soft)}
.gap.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}

/* upgrade */
.upg .inf{font-family:var(--f-mono);font-size:.95rem;background:var(--bad-soft);border-radius:8px;padding:10px 12px;color:var(--ink)}
.upg .inf::before{content:"Informal  ";font-family:var(--f-body);font-size:.7rem;font-weight:700;letter-spacing:.1em;color:var(--bad)}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.88rem}

/* error detective */
.line{display:block;width:100%;text-align:left;border:1.5px solid transparent;background:transparent;border-radius:8px;padding:7px 10px;cursor:pointer;color:var(--ink);font-family:var(--f-mono);font-size:.92rem}
.line:hover{background:var(--surface-2)}
.line.flag{border-color:var(--berry);background:var(--berry-soft)}
.line.hit{border-color:var(--good);background:var(--good-soft)}
.line.miss{border-color:var(--warn);border-style:dashed}
.line.false{border-color:var(--bad);background:var(--bad-soft)}
.line .why{display:block;font-family:var(--f-body);font-size:.85rem;color:var(--muted);margin-top:4px}

/* builder */
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.scen button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;color:var(--ink);display:flex;flex-direction:column;gap:4px}
.scen button:hover{border-color:var(--moss)}
.scen button.on{border-color:var(--berry);background:var(--berry-soft)}
.scen button small{color:var(--muted)}
.scen .done-tag{font-size:.7rem;font-weight:700;color:var(--good);text-transform:uppercase;letter-spacing:.08em}
.task{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:12px 14px}
.task b{font-family:var(--f-display)}
.compose{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.crow{display:grid;grid-template-columns:90px minmax(0,1fr);align-items:center;border-bottom:1px solid var(--line)}
.crow > span{padding:8px 12px;color:var(--muted);font-size:.85rem}
.crow select,.crow input{border:0;border-radius:0;background:transparent}
.cbody{padding:12px;display:flex;flex-direction:column;gap:10px}
.cbody textarea{border-style:dashed}
.phrasechips{display:flex;flex-wrap:wrap;gap:6px}
.pchip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 10px;font-size:.82rem;cursor:pointer;color:var(--ink)}
.pchip:hover{border-color:var(--moss)}
.pchip.vocab{border-color:var(--berry);color:var(--berry)}
.pchip.vocab.used{background:var(--berry);color:var(--on-berry)}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:.92rem}
.checks .m{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;margin-top:1px}
.checks .ok .m{background:var(--good);color:var(--surface)}
.checks .no .m{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad)}
.checks .tip{display:block;color:var(--muted);font-size:.82rem}
.wc{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.preview{white-space:pre-wrap;font-size:.95rem}
.scorebig{font-family:var(--f-display);font-size:2.2rem;font-weight:800;color:var(--moss);font-variant-numeric:tabular-nums}

/* quiz */
.qwrap{display:flex;flex-direction:column;gap:14px}
.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.qtext{font-size:1.1rem;font-weight:600;max-width:65ch}
.result{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0}
.ring{width:140px;height:140px}

/* stamps */
.stamps{display:flex;flex-wrap:wrap;gap:14px}
.stamp{width:104px;padding:8px;background:var(--surface);position:relative;text-align:center;
  -webkit-mask:radial-gradient(circle 5px at 5px 5px,transparent 98%,#000) -5px -5px/12px 12px;
          mask:radial-gradient(circle 5px at 5px 5px,transparent 98%,#000) -5px -5px/12px 12px;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.stamp .inner{border:1.5px solid var(--moss);border-radius:4px;padding:10px 4px;min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--moss-soft)}
.stamp svg{width:30px;height:30px;stroke:var(--moss);fill:none;stroke-width:1.8}
.stamp b{font-size:.72rem;line-height:1.15;font-family:var(--f-display)}
.stamp.locked{opacity:.35;filter:grayscale(1)}
.stamp.locked .inner{border-style:dashed}

/* glossary */
.gtable{width:100%;border-collapse:collapse;font-size:.94rem}
.gtable th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
.gtable td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.gtable td.ar{font-size:1.1rem;color:var(--berry);text-align:right}
.gtable .w{font-weight:700;font-family:var(--f-display)}
.scroll{overflow-x:auto}

/* certificate */
.cert{border:3px double var(--moss);border-radius:14px;padding:30px 24px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;background:
  repeating-linear-gradient(45deg,var(--berry) 0 10px,transparent 10px 20px,var(--moss) 20px 30px,transparent 30px 40px) top/100% 6px no-repeat,var(--surface)}
.cert h2{font-size:1.9rem;color:var(--moss)}
.cert .nm{font-family:var(--f-display);font-size:2rem;font-weight:800;color:var(--berry);border-bottom:2px solid var(--line);padding:0 20px 4px}
.reflect{display:grid;gap:12px}
.scale{display:flex;gap:8px;flex-wrap:wrap}
.scale button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.scale button.on{background:var(--berry);color:var(--on-berry);border-color:var(--berry)}

footer{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 30px;color:var(--muted);font-size:.85rem;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:60;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(10,14,6,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:var(--surface);border-radius:14px;padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:85vh;overflow:auto}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  nav.folders{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .folders .lab{display:none}
  .folder{width:auto;flex:none;padding:8px 10px}
  .folder .t small{display:none}
  .hero,.two,.match{grid-template-columns:minmax(0,1fr)}
  .envelope{max-width:200px}
}
@media (max-width:560px){
  .duel,.compare{grid-template-columns:minmax(0,1fr)}
  .crow{grid-template-columns:70px minmax(0,1fr)}
  .brand small{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- readability: larger type, more space ---- */
body{font-size:17.5px;line-height:1.65}
.top{padding:12px 20px}

/* one activity at a time */
.stepper{display:flex;gap:10px;flex-wrap:wrap}
.step{flex:1 1 170px;display:flex;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;cursor:pointer;color:var(--ink);font-size:.98rem;min-width:0}
.step:hover{border-color:var(--moss)}
.step .num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;font-variant-numeric:tabular-nums}
.step.on{border-color:var(--berry);background:var(--berry-soft);font-weight:600}
.step.on .num{background:var(--berry);color:var(--on-berry)}
.step span:last-child{min-width:0;overflow-wrap:anywhere;line-height:1.3}
.stepnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px;margin-top:4px}

/* final writing */
.include{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.include label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.94rem}
.include input{margin-top:4px;accent-color:var(--moss);width:18px;height:18px;flex:none}
.level{display:inline-block;font-size:.7rem;font-weight:700;letter-spacing:.08em;border:1px solid var(--berry);color:var(--berry);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:2px}
.sample{border:1.5px solid var(--moss);border-radius:12px;overflow:hidden}
.sample .sh{background:var(--moss);color:var(--on-moss);padding:8px 14px;font-weight:700;font-size:.9rem}
.sample .sb{padding:14px 16px;white-space:pre-wrap;line-height:1.6}
.sample .sb b{color:var(--berry)}
.designer{font-size:.9rem;color:var(--muted)}
.designer b{color:var(--ink)}

/* portfolio report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 22px;display:flex;flex-direction:column;gap:18px}
.rep-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--moss);padding-bottom:12px}
.rep-head h2{font-size:1.5rem}
.rep-meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:.9rem;align-content:start}
.rep-meta dt{color:var(--muted)}
.rep-meta dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.rep-sec h3{font-size:1.1rem;color:var(--moss);border-bottom:1px solid var(--line);padding-bottom:4px;margin-bottom:10px}
.rep-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;break-inside:avoid}
.rep-item h4{margin:0 0 4px;font-family:var(--f-display);font-size:1rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rep-email{white-space:pre-wrap;font-size:.92rem;background:var(--surface-2);border-radius:8px;padding:10px 12px;margin:8px 0;line-height:1.55}
.rep-checks{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--muted)}
.rep-checks .y{color:var(--good)}
.rep-checks .n{color:var(--bad)}
.qtable{width:100%;border-collapse:collapse;font-size:.86rem}
.qtable td,.qtable th{border-bottom:1px solid var(--line);padding:6px;text-align:left;vertical-align:top}
.qtable th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.empty{color:var(--muted);font-style:italic;font-size:.92rem}

/* ---------- state ---------- */
let S=fresh();
function fresh(){return {app:"Send It Right",version:1,name:"",points:0,badges:[],earned:{},complete:{},flipped:[],builder:{},final:{},quiz:null,reflection:{conf:0,word:"",change:""},started:new Date().toISOString()};}
let cur="start";

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const embedded=(()=>{try{return window.self!==window.top}catch(e){return true}})();
function toast(t,ms){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms||2600)}
function earn(key,pts){if(S.earned[key])return false;S.earned[key]=pts;S.points+=pts;hud();return true}
function badge(id){if(S.badges.includes(id))return;S.badges.push(id);hud();const b=BADGES.find(x=>x.id===id);confetti();toast("New badge: "+b.name+"!",3200)}
function complete(sec){S.complete[sec]=true;folders()}
function hud(){$("#hudPts").textContent=S.points;$("#hudBdg").textContent=S.badges.length+"/"+BADGES.length}
function firstName(){return (S.name||"").trim().split(/\s+/)[0]||"there"}
function speak(t){try{const u=new SpeechSynthesisUtterance(t.split(" /")[0]);u.lang="en-GB";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function card(meta,title,body,id){return `<section class="msg" ${id?'id="'+id+'"':""}><div class="msg-h"><div class="meta">${meta}</div><h2>${title}</h2></div><div class="msg-b">${body}</div></section>`}
function meta(phase,n,of){return `<span>${phase} · Activity ${n} of ${of}</span>`}

/* ---------- folders ---------- */
function folders(){
 $("#folders").innerHTML='<div class="lab">Folders</div>'+FOLDERS.map(f=>{
  const st=(f.id==="start"||f.id==="glossary"||f.id==="portfolio")?"none":(S.complete[f.id]?"ok":"");
  return `<button class="folder ${cur===f.id?"on":""}" data-f="${f.id}" aria-current="${cur===f.id?"page":"false"}"><span class="ico"><svg viewBox="0 0 16 16">${f.ic}</svg></span><span class="t">${f.name}<small>${f.sub}</small></span><span class="dot ${st}" title="${st==="ok"?"Complete":"To do"}"></span></button>`}).join("");
 $("#folders").querySelectorAll(".folder").forEach(b=>b.onclick=()=>go(b.dataset.f));
}
function stepify(m){
 const cards=[...m.children].filter(c=>c.classList.contains("msg"));if(cards.length<2)return;
 view.step=view.step||{};const key=cur;
 const bar=document.createElement("div");bar.className="stepper noprint";bar.setAttribute("role","tablist");
 bar.innerHTML=cards.map((c,i)=>`<button class="step" role="tab" data-step="${i}"><span class="num">${i+1}</span><span>${esc(c.querySelector("h2").textContent)}</span></button>`).join("");
 m.insertBefore(bar,cards[0]);
 cards.forEach((c,i)=>{const nav=document.createElement("div");nav.className="stepnav noprint";
  nav.innerHTML=(i>0?`<button class="btn ghost" data-step="${i-1}">← Previous</button>`:"<span></span>")+(i<cards.length-1?`<button class="btn" data-step="${i+1}">Next activity →</button>`:"");
  c.querySelector(".msg-b").appendChild(nav)});
 const show=(i,scroll)=>{view.step[key]=i;cards.forEach((c,j)=>c.hidden=j!==i);bar.querySelectorAll(".step").forEach((b,j)=>{b.classList.toggle("on",j===i);b.setAttribute("aria-selected",j===i)});if(scroll)window.scrollTo({top:0,behavior:"smooth"})};
 m.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>show(+b.dataset.step,true)));
 show(Math.min(view.step[key]||0,cards.length-1));
}
function go(id){cur=id;folders();const m=$("#main");m.innerHTML="";({start:rStart,engage:rEngage,explore:rExplore,explain:rExplain,extend:rExtend,write:rWrite,evaluate:rEvaluate,portfolio:rPortfolio,glossary:rGlossary}[id])(m);if(["engage","explore","explain","extend","evaluate"].includes(id))stepify(m);window.scrollTo({top:0,behavior:"smooth"})}
function nextBtn(to,label){return `<div class="row noprint"><button class="btn" data-go="${to}">${label}</button></div>`}
function bindGo(root){root.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}

 const inp=$("#studentName");inp.oninput=()=>{S.name=inp.value};

/* ---------- ENGAGE ---------- */
function rEngage(m){
 view.duel=0;view.duelScore=0;view.dd={};
 m.innerHTML=card(meta("Engage",1,2),"Which email would you open first?",`
   <p class="lead">Look at each situation. Choose the better subject line.</p><div id="duelBox"></div>`)
 +card(meta("Engage",2,2),"Do or Don't?",`
   <p class="lead">You learned these last week. Is each one a <b>Do</b> or a <b>Don't</b> in a professional email?</p>
   <div class="sort" id="ddBox"></div><div id="ddFb"></div>`)
 +`<div id="engNext"></div>`;
 duelRender();ddRender();
}
function duelRender(){
 const box=$("#duelBox");const i=view.duel;
 if(i>=DUELS.length){box.innerHTML=`<div class="fb good">You chose ${view.duelScore} of ${DUELS.length} correctly. A clear subject line helps your email get read.</div>`;S.complete.engage1=true;engageCheck();return}
 const d=DUELS[i];
 box.innerHTML=`<p class="count">Situation ${i+1} of ${DUELS.length}</p><p><b>${esc(d.q)}</b></p>
  <div class="duel">${d.opts.map((o,k)=>`<button class="choice subjline" data-k="${k}">${esc(o)}</button>`).join("")}</div><div id="duelFb"></div>`;
 box.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
  const k=+b.dataset.k;box.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(+x.dataset.k===d.c)x.classList.add("right")});
  if(k===d.c){view.duelScore++;earn("duel"+i,5)}else b.classList.add("wrong");
  $("#duelFb").innerHTML=`<div class="fb ${k===d.c?"good":"bad"}">${k===d.c?"Correct! ":"Not quite. "}${esc(d.why)}</div><div class="row" style="margin-top:10px"><button class="btn ghost" id="duelNext">${i+1<DUELS.length?"Next situation":"Finish"}</button></div>`;
  $("#duelNext").onclick=()=>{view.duel++;duelRender()};
 });
}
function ddRender(){
 const items=view.ddOrder||(view.ddOrder=shuffle(DODONT.map((_,i)=>i)));
 $("#ddBox").innerHTML=items.map(i=>{const d=DODONT[i];const a=view.dd[i];const cls=a?(a===d.a?"right":"wrong"):"";
  return `<div class="sort-item ${cls}"><span class="s">${esc(d.s)}</span>${a?`<b class="small" style="color:var(--${a===d.a?"good":"bad"})">${d.a==="do"?"DO":"DON'T"}${a===d.a?"":" — the answer is "+(d.a==="do"?"Do":"Don't")}</b>`:`<button class="tag do" data-i="${i}" data-a="do">Do</button><button class="tag dont" data-i="${i}" data-a="dont">Don't</button>`}</div>`}).join("");
 $("#ddBox").querySelectorAll(".tag").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;view.dd[i]=b.dataset.a;if(b.dataset.a===DODONT[i].a)earn("dd"+i,3);ddRender()});
 const n=Object.keys(view.dd).length;
 if(n===DODONT.length){const ok=DODONT.filter((d,i)=>view.dd[i]===d.a).length;$("#ddFb").innerHTML=`<div class="fb ${ok>=8?"good":"info"}">You sorted <b class="tally">${ok}/${DODONT.length}</b> correctly. ${ok>=8?"Great memory!":"Read the red ones again before you move on."}</div>`;S.complete.engage2=true;engageCheck()}
}
function engageCheck(){if(S.complete.engage1&&S.complete.engage2){complete("engage");badge("inbox");$("#engNext").innerHTML=nextBtn("explore","Next folder: Explore");bindGo($("#engNext"))}}

/* ---------- EXPLORE ---------- */
function rExplore(m){
 view.seen=new Set();view.ord=[];view.pool=shuffle(ORDER.map((_,i)=>i));view.ab=null;view.reasons=new Set();
 m.innerHTML=card(meta("Explore",1,3),"The anatomy of an email",`

 return {s,subj:g("bSubj")===""?null:+g("bSubj"),greet:g("bGreet")===""?null:+g("bGreet"),body:g("bBody"),close:g("bClose")===""?null:+g("bClose"),sign:g("bSign")===""?null:+g("bSign"),sig:g("bSig")}}
function builderText(){const v=bv();return `Subject: ${v.subj!==null?v.s.subjects[v.subj]:""}\n\n${v.greet!==null?v.s.greetings[v.greet]:""}\n\n${v.body.trim()}\n\n${v.close!==null?CLOSINGS[v.close]:""}\n\n${v.sign!==null?SIGNOFFS[v.sign]:""}\n${v.sig.trim()}`}
function builderEval(){
 const v=bv();const all=[v.body,v.close!==null?CLOSINGS[v.close]:"",v.sig].join(" ");
 const words=v.body.trim()?v.body.trim().split(/\s+/).length:0;
 const used=VOCAB.filter(w=>w.re.test(v.body));
 const capsBad=(all.match(/\b[A-Z]{3,}\b/g)||[]).filter(w=>!CAPS_OK.has(w));
 const sentStartBad=/(^|[.!?]\s+)[a-z]/.test(v.body.trim())||/\bi\b/.test(v.body);
 const C=[
  {ok:v.subj===v.s.cs,t:"Clear subject line",tip:"Choose the subject line that says what the email is about, with no capitals or emojis."},
  {ok:v.greet===v.s.cg,t:"Formal greeting",tip:"Dear + title + family name (or Dear Sir or Madam)."},
  {ok:words>=40&&words<=120,t:"Body is 40–120 words",tip:words<40?"Add more detail: what happened and what you need.":"Make it shorter. Be concise."},
  {ok:/could you|would you|would it be possible|i would appreciate|please/i.test(v.body),t:"A polite request",tip:"Use Could you please …? or I would appreciate it if …"},
  {ok:used.length>=2,t:"Uses 2 or more email words from the lesson",tip:"Try "+v.s.words.slice(0,3).join(", ")+"."},
  {ok:!/\p{Extended_Pictographic}/u.test(all),t:"No emojis",tip:"Remove all emojis."},
  {ok:capsBad.length===0,t:"No ALL CAPS words",tip:capsBad.length?"Change: "+capsBad.slice(0,3).join(", "):""},
  {ok:!TEXTSPEAK.test(all),t:"No text-speak (u, pls, thx…)",tip:"Write full words: you, please, thank you."},
  {ok:!CONTR.test(v.body),t:"No contractions (I'm, can't…)",tip:"Write I am, cannot, I will."},
  {ok:words>0&&!sentStartBad,t:"Capital letters at the start of sentences and for I",tip:"Check every sentence starts with a capital, and write I, not i."},
  {ok:v.close!==null&&v.close!==BAD_CLOSING&&v.sign!==null&&!BAD_SIGNOFFS.includes(v.sign),t:"Polite closing line and formal sign-off",tip:"Choose a formal closing line and Best regards, Kind regards or Sincerely."},
  {ok:v.sig.trim().split(/\s+/).length>=2&&/[A-Z]/.test(v.sig),t:"Signature with your full name",tip:"Write your first and family name, then your course."}
 ];
 view.checks=C;const score=C.filter(c=>c.ok).length;view.bscore=score;
 $("#bChecks").innerHTML=C.map(c=>`<li class="${c.ok?"ok":"no"}"><span class="m">${c.ok?"✓":"!"}</span><span>${c.t}${c.ok?"":`<span class="tip">${esc(c.tip)}</span>`}</span></li>`).join("");
 $("#bScore").textContent="· "+score+"/12";
 $("#bWc").textContent=words+" words";
 $("#bVocab").innerHTML=v.s.words.map(w=>{const vv=VOCAB.find(x=>x.key===w);return `<span class="pchip vocab ${vv&&vv.re.test(v.body)?"used":""}">${w}</span>`}).join("");
 $("#pvSubj").textContent=v.subj!==null?v.s.subjects[v.subj]:"(no subject)";
 $("#pvBody").textContent=builderText().split("\n\n").slice(1).join("\n\n");
}
function builderSend(){
 const v=bv();const sc=view.bscore;
 S.builder[v.s.id]={scenario:v.s.title,subj:v.subj,greet:v.greet,body:v.body,close:v.close,sign:v.sign,signature:v.sig,score:sc,email:builderText(),checked:new Date().toISOString()};
 earn("build_"+v.s.id,sc*2);
 const missing=view.checks.filter(c=>!c.ok);
 $("#bFb").innerHTML=`<div class="fb ${sc>=10?"good":"info"}"><span class="scorebig">${sc}/12</span><br>${sc>=10?"Well done! This email is ready to send.":"Fix the red points in the checklist and send again."}${missing.length&&sc>=10?" Small fix: "+missing.map(c=>c.t.toLowerCase()).join(", ")+".":""}</div>`;
 if(sc>=10){badge("author");S.complete.ext4=true;extendCheck()}
 scenRender();
}
function extendCheck(){if(S.complete.ext1&&S.complete.ext2&&S.complete.ext3&&S.complete.ext4&&!$("#extNext").innerHTML){complete("extend");$("#extNext").innerHTML=nextBtn("write","Next folder: Write");bindGo($("#extNext"))}}

function ftRender(){

 $("#ftWork").innerHTML=`
  <div class="task"><b>Situation:</b> ${esc(t.situation)}</div>

      <div class="row" style="justify-content:space-between"><span class="wc" id="fWc">0 words</span><span class="wc">Target: 80–150 words</span></div></div>
    </div>

   </div>

    <div id="fFb"></div>
   </div>
  </div><div id="fSampleBox"></div>`;
 ["fSubj","fBody"].forEach(id=>$("#"+id).addEventListener("input",ftEval));

 ftEval();

function ftEval(){
 const t=FINAL.find(x=>x.id===view.ft);const subj=$("#fSubj").value.trim();const body=$("#fBody").value;
 const lines=body.split("\n").map(l=>l.trim()).filter(Boolean);
 const words=body.trim()?body.trim().split(/\s+/).length:0;
 const all=subj+" "+body;
 const used=VOCAB.filter(w=>w.re.test(body));
 const capsBad=(all.match(/\b[A-Z]{3,}\b/g)||[]).filter(w=>!CAPS_OK.has(w));
 const signIdx=lines.findIndex(l=>/^(best regards|kind regards|regards|sincerely|yours sincerely|yours faithfully|best wishes)\s*,?$/i.test(l));
 const nameLine=signIdx>=0?lines[signIdx+1]||"":"";
 const paras=body.trim().split(/\n\s*\n/).filter(p=>p.trim()).length;
 const sentStartBad=/(^|[.!?]\s+)[a-z]/.test(body.trim())||/\bi\b/.test(body);
 const C=[
  {ok:subj.split(/\s+/).filter(Boolean).length>=3&&!/\b[A-Z]{4,}\b/.test(subj.replace(/\b(LSC|HCT|IELTS|ADNOC)\b/g,""))&&!/!/.test(subj),t:"Clear subject line (3+ words, no CAPS or !)",tip:"Example: Request to reschedule my presentation"},
  {ok:/^dear\s+\S+/i.test(lines[0]||"")&&/,$/.test(lines[0]||""),t:"Formal greeting with a comma",tip:"Start with Dear Ms. …, / Dear Sir or Madam,"},
  {ok:/i am writing|i hope you are|i would like to|my name is/i.test(body),t:"Opening line that gives the reason",tip:"Try: I am writing regarding …"},
  {ok:/could you|would you|would it be possible|i would appreciate|please/i.test(body),t:"A polite request",tip:"Use Could you please …? or I would appreciate it if …"},
  {ok:used.length>=2,t:"2 or more email words from the lesson"+(used.length?" ("+used.map(u=>u.key).join(", ")+")":""),tip:"Try regarding, apologize, attachment, confirm, available …"},
  {ok:words>=80&&words<=150,t:"80–150 words",tip:words<80?"Add more detail.":"Make it shorter and more concise."},
  {ok:paras>=4,t:"Short paragraphs (leave an empty line between them)",tip:"Greeting / opening / body / closing / sign-off on separate lines."},
  {ok:!/\p{Extended_Pictographic}/u.test(all)&&capsBad.length===0,t:"No emojis and no ALL CAPS words",tip:capsBad.length?"Change: "+capsBad.slice(0,3).join(", "):"Remove emojis."},
  {ok:!TEXTSPEAK.test(all)&&!CONTR.test(body),t:"No text-speak or contractions",tip:"Write you, please, I am, cannot, I will."},
  {ok:words>0&&!sentStartBad,t:"Capital letters at the start of sentences and for I",tip:"Check each sentence starts with a capital, and write I, not i."},
  {ok:/look forward|thank you|let me know|for your (help|time|understanding)/i.test(body),t:"Polite closing line",tip:"Thank you for your help. / I look forward to hearing from you."},
  {ok:signIdx>=0&&nameLine.split(/\s+/).length>=2,t:"Formal sign-off and your full name",tip:"Kind regards, then your first and family name on the next line."}
 ];
 view.fchecks=C;view.fscore=C.filter(c=>c.ok).length;
 $("#fChecks").innerHTML=C.map(c=>`<li class="${c.ok?"ok":"no"}"><span class="m">${c.ok?"✓":"!"}</span><span>${esc(c.t)}${c.ok?"":`<span class="tip">${esc(c.tip)}</span>`}</span></li>`).join("");
 $("#fScore").textContent="· "+view.fscore+"/12";$("#fWc").textContent=words+" words";
}
function ftSubmit(){
 const t=FINAL.find(x=>x.id===view.ft);const words=$("#fBody").value.trim().split(/\s+/).filter(Boolean).length;
 if(words<30){toast("Write more before you submit (at least 30 words).");return}
 const ticks=[...$("#fInc").querySelectorAll("input:checked")].map(x=>+x.dataset.i);
 S.final[t.id]={task:t.title,to:t.to,situation:t.situation,subject:$("#fSubj").value.trim(),body:$("#fBody").value,score:view.fscore,ticks,content:t.include.map((p,i)=>({point:p,included:ticks.includes(i)})),checks:view.fchecks.map(c=>({check:c.t,ok:c.ok})),date:new Date().toISOString()};
 earn("final_"+t.id,view.fscore*3);
 const miss=t.include.length-ticks.length;
 $("#fFb").innerHTML=`<div class="fb ${view.fscore>=9?"good":"info"}"><span class="scorebig">${view.fscore}/12</span><br>${view.fscore>=9?"Well done! Your email is clear and professional.":"Good effort. Fix the red points and submit again."}${miss?` You have not ticked ${miss} content point${miss>1?"s":""}. Check that your email includes ${miss>1?"them":"it"}.`:""} Now compare your email with the sample answer.</div>`;
 $("#fSample").disabled=false;ftTiles();
 if(finalCount(9)>=3)badge("ready");
 wrCheck();
 if(certOK()&&!S.earned.certToast){S.earned.certToast=1;toast("Certificate unlocked! Open the Evaluate folder.",3500)}

function quizIntro(){
 $("#quiz").innerHTML=`<p class="lead">12 questions about real email situations. The questions come in a different order each time. Score 80% or more (10/12) for your certificate.</p><div class="row"><button class="btn" id="qStart">Start the quiz</button></div>`;
 $("#qStart").onclick=()=>{view.qs=shuffle(QUIZ.map((q,i)=>({i,opts:shuffle(q.o)})));view.qi=0;view.qok=0;view.qans=[];qRender()};

function qRender(){
 const box=$("#quiz");const it=view.qs[view.qi];const q=QUIZ[it.i];
 box.innerHTML=`<div class="qwrap"><div class="qtop"><span class="count">Question ${view.qi+1} of ${QUIZ.length}</span><span class="count">Correct: ${view.qok}</span></div>

 box.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{
  const ok=b.dataset.o===q.o[0];box.querySelectorAll(".choice").forEach(x=>{x.disabled=true;if(x.dataset.o===q.o[0])x.classList.add("right")});

 });

function printTarget(el){
 if(embedded)toast("Printing works when the app is opened on its own page (GitHub Pages).",4000);
 let top=el;while(top.parentElement&&top.parentElement.id!=="main")top=top.parentElement;el=top;

 setTimeout(()=>{if(embedded)done()},500);
}

  <section class="rep-sec"><h3>1. Final writing tasks</h3>
   ${fin.length?fin.map(f=>`<div class="rep-item"><h4><span>${esc(f.task)}</span><span>${f.score}/12</span></h4>
    <p class="small muted"><b>To:</b> ${esc(f.to)} · <b>Task:</b> ${esc(f.situation)}</p>
    <div class="rep-email"><b>Subject:</b> ${esc(f.subject)}\n\n${esc(f.body.trim())}</div>
    ${checksLine(f.checks)}
    <div class="rep-checks" style="margin-top:4px">${f.content.map(c=>`<span class="${c.included?"y":"n"}">${c.included?"✓":"✗"} ${esc(c.point)}</span>`).join("")}</div></div>`).join(""):`<p class="empty">No final emails yet. Go to the Write folder.</p>`}
  </section>
  <section class="rep-sec"><h3>2. Email Builder practice</h3>
   ${bld.length?bld.map(b=>`<div class="rep-item"><h4><span>${esc(b.scenario)}</span><span>${b.score}/12</span></h4><div class="rep-email">${esc(b.email)}</div></div>`).join(""):`<p class="empty">No Email Builder emails yet. Go to the Extend folder.</p>`}
  </section>
  <section class="rep-sec"><h3>3. Final quiz</h3>
   ${S.quiz?`<p><b>Score:</b> ${S.quiz.score}/${S.quiz.total} (${S.quiz.pct}%)</p><div class="scroll"><table class="qtable"><thead><tr><th>#</th><th>Question</th><th>My answer</th><th>Correct answer</th></tr></thead><tbody>${S.quiz.answers.map((a,i)=>`<tr><td>${i+1}</td><td>${esc(a.q)}</td><td style="color:var(--${a.ok?"good":"bad"})">${a.ok?"✓ ":"✗ "}${esc(a.chosen)}</td><td>${esc(a.correct)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="empty">Quiz not taken yet.</p>`}
  </section>
  <section class="rep-sec"><h3>4. Reflection</h3>
   <p><b>Confidence:</b> ${ref.conf?ref.conf+" / 5":"—"}</p>
   <p><b>The word I will use most:</b> ${esc(ref.word||"—")}</p>
   <p><b>One thing I will change:</b> ${esc(ref.change||"—")}</p>
  </section>
  <section class="rep-sec"><h3>5. Badges</h3>${S.badges.length?stampsHTML(false):'<p class="empty">No badges yet.</p>'}</section>
  ${certOK()?`<div class="page-break">${certHTML()}</div>`:""}
 </article>`;
 $("#printRep").onclick=()=>printTarget($("#report"));
}

/* ---------- GLOSSARY ---------- */
function rGlossary(m){
 m.innerHTML=card('<span><b>Reference</b></span>',"Email glossary · English / عربي",`
  <div class="field" style="max-width:340px"><label for="gSearch">Search</label><input type="text" id="gSearch" placeholder="Type a word or Arabic meaning"></div>
  <div class="scroll"><table class="gtable"><thead><tr><th>Word</th><th>Meaning</th><th>Example</th><th style="text-align:right">عربي</th></tr></thead><tbody id="gBody"></tbody></table></div>`);
 const draw=f=>{f=(f||"").toLowerCase();$("#gBody").innerHTML=VOCAB.filter(v=>!f||(v.w+v.def+v.ar).toLowerCase().includes(f)).map(v=>`<tr><td><span class="w">${esc(v.w)}</span><br><span class="small muted">${v.pos}</span></td><td>${esc(v.def)}</td><td class="small"><i>${hl(v.ex,v)}</i></td><td class="ar">${v.ar}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">No words match.</td></tr>'};
 draw();$("#gSearch").oninput=e=>draw(e.target.value);
}

/* ---------- save / load ---------- */
function download(kind){
 const data=Object.assign({},S,{savedAt:new Date().toISOString(),kind});
 const nm=(S.name||"student").trim().replace(/\s+/g,"_").replace(/[^\w-]/g,"");
 const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`SendItRight_${kind}_${nm}.json`;document.body.appendChild(a);a.click();
 setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
 toast(embedded?"Downloads work when the app is opened on its own page.":(kind==="results"?"Results downloaded.":"Progress saved to your Downloads."),3500);
}
$("#saveBtn").onclick=()=>download("progress");
$("#loadBtn").onclick=()=>$("#loadFile").click();
$("#loadFile").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(d.app!=="Send It Right")throw 0;S=Object.assign(fresh(),d);hud();toast("Welcome back, "+firstName()+"!");go(cur)}catch(err){toast("That file is not a Send It Right save file.")}};r.readAsText(f);e.target.value=""};
$("#hudBadges").onclick=()=>{const d=document.createElement("div");d.className="modal";d.innerHTML=`<div class="box" role="dialog" aria-label="Your badges"><h3>Your badges · ${S.badges.length} of ${BADGES.length}</h3>${stampsHTML(true)}<div class="row"><button class="btn" id="mClose">Close</button></div></div>`;document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.id==="mClose")d.remove()}};

/* ---------- confetti ---------- */
function confetti(){
 if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const c=$("#confetti"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
 const cs=getComputedStyle(document.documentElement);const cols=[cs.getPropertyValue("--moss").trim(),cs.getPropertyValue("--berry").trim(),"#f5b700","#3fa7d6"];
 const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:Math.random()*6.28,s:5+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
 let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(++t<170)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}

hud();go("start");
})();
</script>
